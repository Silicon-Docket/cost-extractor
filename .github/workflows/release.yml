name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release (e.g. v1.0.0) — used when running manually"
        required: true
        default: "v0.0.0-manual"

permissions:
  contents: write

env:
  TESSERACT_VERSION: "5.4.0.20240606"
  TESSERACT_URL: "https://github.com/UB-Mannheim/tesseract/releases/download/v5.4.0.20240606/tesseract-ocr-w64-setup-5.4.0.20240606.exe"
  TESSERACT_SHA256: "c885fff6998e0608ba4bb8ab51436e1c6775c2bafc2559a19b423e18678b60c9"

jobs:
  determine-version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      bundle_version: ${{ steps.version.outputs.bundle_version }}
    steps:
      - name: Determine version
        id: version
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_VERSION: ${{ inputs.version }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            version="$INPUT_VERSION"
          else
            version="$REF_NAME"
          fi

          # Normalize once here and let the build jobs consume the result.
          # Deriving it a second time next to the check that verifies it lets
          # both copies make the same mistake and agree with each other.
          #
          # `tags: v*.*.*` is a glob, not a semver pattern: `vbeta.1.0` is a
          # legal git tag that matches it and starts a release. Refuse those
          # outright rather than quietly stamping the 0.0.0 dev-build marker
          # onto a real release.
          bundle_version=$(printf '%s' "${version#v}" | grep -oE '^[0-9]+(\.[0-9]+){0,2}' || true)
          if [ -z "$bundle_version" ]; then
            echo "::error::Version '$version' has no leading N[.N[.N]] -- tag releases as vMAJOR.MINOR.PATCH"
            exit 1
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "bundle_version=$bundle_version" >> "$GITHUB_OUTPUT"

  build-windows:
    needs: determine-version
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Exclude workspace from Windows Defender
        shell: pwsh
        run: |
          # PyInstaller bootloaders are a well-known Defender false-positive
          # pattern; without this, Defender can silently quarantine/delete
          # the freshly-built exe before the OCR selftest step even runs.
          Add-MpPreference -ExclusionPath "$env:GITHUB_WORKSPACE" -ErrorAction SilentlyContinue
          Add-MpPreference -ExclusionProcess "CostExtractor.exe" -ErrorAction SilentlyContinue

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Fetch and vendor Tesseract-OCR
        shell: pwsh
        run: |
          $installer = "$env:RUNNER_TEMP\tesseract-setup.exe"
          Invoke-WebRequest -Uri "$env:TESSERACT_URL" -OutFile $installer

          $actualHash = (Get-FileHash $installer -Algorithm SHA256).Hash.ToLower()
          if ($actualHash -ne "$env:TESSERACT_SHA256") {
            Write-Error "Tesseract installer hash mismatch: expected $env:TESSERACT_SHA256, got $actualHash"
            exit 1
          }

          if (-not (Get-Command 7z -ErrorAction SilentlyContinue)) {
            choco install 7zip -y --no-progress
          }
          $extractDir = "$env:RUNNER_TEMP\tesseract-extracted"
          7z x $installer -o"$extractDir" -y | Out-Null

          New-Item -ItemType Directory -Force -Path "vendor" | Out-Null
          Move-Item "$extractDir" "vendor\tesseract"

          # Prune to what's actually needed at runtime (matches README's manual steps).
          # $PLUGINSDIR only appears via this raw NSIS extraction (not present when
          # installed normally) — it's installer scaffolding, not app runtime files.
          Remove-Item "vendor\tesseract\`$PLUGINSDIR" -Recurse -Force -ErrorAction SilentlyContinue
          Get-ChildItem vendor\tesseract -Filter *.exe | Where-Object { $_.Name -ne "tesseract.exe" } | Remove-Item -Force
          Get-ChildItem vendor\tesseract -Filter *.html | Remove-Item -Force
          Get-ChildItem vendor\tesseract\tessdata -Filter *.jar -ErrorAction SilentlyContinue | Remove-Item -Force
          Remove-Item vendor\tesseract\doc -Recurse -Force -ErrorAction SilentlyContinue
          Remove-Item vendor\tesseract\tessdata\osd.traineddata -Force -ErrorAction SilentlyContinue
          Remove-Item vendor\tesseract\tessdata\pdf.ttf -Force -ErrorAction SilentlyContinue
          Remove-Item vendor\tesseract\tesseract-uninstall.exe -Force -ErrorAction SilentlyContinue

          if (-not (Test-Path "vendor\tesseract\tesseract.exe")) {
            Write-Error "vendor\tesseract\tesseract.exe missing after extraction"
            exit 1
          }

      - name: Run tests
        run: python -m pytest tests/ -q

      - name: Build portable app
        run: python -m PyInstaller build/cost_extractor.spec --noconfirm --clean

      - name: Generate OCR selftest fixture
        run: python scripts/make_selftest_fixture.py "$env:RUNNER_TEMP\selftest.pdf"

      - name: OCR selftest against the packaged exe
        shell: pwsh
        run: |
          if (-not (Test-Path "$env:RUNNER_TEMP\selftest.pdf")) {
            Write-Error "Fixture generation did not produce $env:RUNNER_TEMP\selftest.pdf"
            exit 1
          }
          if (-not (Test-Path ".\dist\CostExtractor\CostExtractor.exe")) {
            Write-Error "CostExtractor.exe is missing right before invocation -- likely quarantined/deleted by antivirus"
            exit 1
          }

          # console=False means the app has no attached stdout/stderr, so an
          # unhandled Python exception normally has nowhere to go and is
          # silently swallowed. Start-Process -RedirectStandard* attaches
          # real OS-level file handles at process-creation time (not just
          # Python's sys.stdout), which actually captures a crash traceback.
          $stdout = "$env:RUNNER_TEMP\selftest_stdout.txt"
          $stderr = "$env:RUNNER_TEMP\selftest_stderr.txt"
          $proc = Start-Process -FilePath ".\dist\CostExtractor\CostExtractor.exe" `
            -ArgumentList "--selftest", "`"$env:RUNNER_TEMP\selftest.pdf`"" `
            -RedirectStandardOutput $stdout -RedirectStandardError $stderr `
            -PassThru -Wait -NoNewWindow
          Write-Output "CostExtractor.exe --selftest exit code: $($proc.ExitCode)"
          Write-Output "--- stdout ---"
          Get-Content $stdout -ErrorAction SilentlyContinue
          Write-Output "--- stderr ---"
          Get-Content $stderr -ErrorAction SilentlyContinue

          if (-not (Test-Path "$env:RUNNER_TEMP\selftest_output.txt")) {
            Write-Error "selftest_output.txt was never created -- the packaged exe likely crashed or exited silently (exit code was $($proc.ExitCode))"
            exit 1
          }

          $output = Get-Content "$env:RUNNER_TEMP\selftest_output.txt" -Raw
          Write-Output $output
          if ($output -notmatch "grand_total=2345\.00") {
            Write-Error "OCR selftest did not produce the expected grand_total=2345.00 -- OCR is broken in the packaged build"
            exit 1
          }
          # Without Pillow's Tk bridge the review pane silently shows no
          # crops, and nothing else in CI opens the GUI to notice.
          if ($output -notmatch "crops_displayable=True") {
            Write-Error "PIL.ImageTk is missing from the bundle -- the review pane cannot show crops"
            exit 1
          }

      - name: Zip portable build
        id: zip
        shell: pwsh
        run: |
          $version = "${{ needs.determine-version.outputs.version }}"
          $zipName = "CostExtractor-$version-win64.zip"
          Compress-Archive -Path "dist\CostExtractor" -DestinationPath $zipName
          echo "zip_name=$zipName" >> $env:GITHUB_OUTPUT

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-build
          path: ${{ steps.zip.outputs.zip_name }}
          if-no-files-found: error

  build-macos:
    needs: determine-version
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Fetch and vendor Tesseract-OCR (with bundled dylibs)
        run: |
          set -euo pipefail
          brew install tesseract dylibbundler

          TESS_PREFIX="$(brew --prefix tesseract)"
          VENDOR_DIR="vendor/tesseract-macos"
          mkdir -p "$VENDOR_DIR/tessdata"

          cp "$TESS_PREFIX/bin/tesseract" "$VENDOR_DIR/tesseract"
          cp "$TESS_PREFIX/share/tessdata/eng.traineddata" "$VENDOR_DIR/tessdata/"

          chmod +w "$VENDOR_DIR/tesseract"
          dylibbundler -od -b \
            -x "$VENDOR_DIR/tesseract" \
            -d "$VENDOR_DIR/lib" \
            -p "@executable_path/lib/"

          if [ ! -x "$VENDOR_DIR/tesseract" ]; then
            echo "::error::$VENDOR_DIR/tesseract missing or not executable after bundling"
            exit 1
          fi

      - name: Verify vendored tesseract runs standalone
        run: |
          set -euo pipefail
          # Run from a different directory so any lingering absolute
          # Homebrew paths in the binary's load commands would surface as
          # a failure here, not be masked by cwd/Homebrew still matching.
          cd /tmp
          "$GITHUB_WORKSPACE/vendor/tesseract-macos/tesseract" --version

      - name: Run tests
        run: python -m pytest tests/ -q

      - name: Build portable app
        env:
          COST_EXTRACTOR_VERSION: ${{ needs.determine-version.outputs.bundle_version }}
        run: python -m PyInstaller build/cost_extractor_macos.spec --noconfirm --clean

      - name: Verify the bundle reports this release's version
        env:
          EXPECTED_VERSION: ${{ needs.determine-version.outputs.bundle_version }}
          RELEASE_VERSION: ${{ needs.determine-version.outputs.version }}
        run: |
          set -euo pipefail
          # Nothing else reads Info.plist, so a broken COST_EXTRACTOR_VERSION
          # wiring would silently ship a bundle stamped 0.0.0 -- which is how
          # the version sat at a stale 1.0.0 across three releases. Assert on
          # the built artifact so that failure stops the release instead.
          plist="dist/CostExtractor.app/Contents/Info.plist"
          if [ ! -f "$plist" ]; then
            echo "::error::$plist is missing -- the app bundle did not build"
            exit 1
          fi
          actual=$(plutil -extract CFBundleShortVersionString raw "$plist")
          echo "CFBundleShortVersionString=$actual (expected $EXPECTED_VERSION)"
          if [ "$actual" != "$EXPECTED_VERSION" ]; then
            echo "::error::App bundle reports version $actual, but this release is $RELEASE_VERSION"
            exit 1
          fi

      - name: OCR selftest against the packaged app
        run: |
          set -euo pipefail
          python scripts/make_selftest_fixture.py "$RUNNER_TEMP/selftest.pdf"
          "dist/CostExtractor.app/Contents/MacOS/CostExtractor" --selftest "$RUNNER_TEMP/selftest.pdf"
          output=$(cat "$RUNNER_TEMP/selftest_output.txt")
          echo "$output"
          if ! echo "$output" | grep -q "grand_total=2345.00"; then
            echo "::error::OCR selftest did not produce the expected grand_total=2345.00 -- OCR is broken in the packaged build"
            exit 1
          fi
          if ! echo "$output" | grep -q "crops_displayable=True"; then
            echo "::error::PIL.ImageTk is missing from the bundle -- the review pane cannot show crops"
            exit 1
          fi

      - name: Zip portable build
        id: zip
        run: |
          set -euo pipefail
          version="${{ needs.determine-version.outputs.version }}"
          zip_name="CostExtractor-$version-macos.zip"
          ditto -c -k --sequesterRsrc --keepParent "dist/CostExtractor.app" "$zip_name"
          echo "zip_name=$zip_name" >> "$GITHUB_OUTPUT"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-build
          path: ${{ steps.zip.outputs.zip_name }}
          if-no-files-found: error

  publish-release:
    needs: [determine-version, build-windows, build-macos]
    runs-on: ubuntu-latest
    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create GitHub Release
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ needs.determine-version.outputs.version }}" \
            --repo "${{ github.repository }}" \
            artifacts/windows-build/*.zip \
            artifacts/macos-build/*.zip \
            --title "${{ needs.determine-version.outputs.version }}" \
            --generate-notes
