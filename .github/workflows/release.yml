name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release (e.g. v1.0.0) — used when running manually"
        required: true
        default: "v0.0.0-manual"

permissions:
  contents: write

env:
  TESSERACT_VERSION: "5.4.0.20240606"
  TESSERACT_URL: "https://github.com/UB-Mannheim/tesseract/releases/download/v5.4.0.20240606/tesseract-ocr-w64-setup-5.4.0.20240606.exe"
  TESSERACT_SHA256: "c885fff6998e0608ba4bb8ab51436e1c6775c2bafc2559a19b423e18678b60c9"

jobs:
  determine-version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Determine version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "version=${{ inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            echo "version=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          fi

  build-windows:
    needs: determine-version
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Fetch and vendor Tesseract-OCR
        shell: pwsh
        run: |
          $installer = "$env:RUNNER_TEMP\tesseract-setup.exe"
          Invoke-WebRequest -Uri "$env:TESSERACT_URL" -OutFile $installer

          $actualHash = (Get-FileHash $installer -Algorithm SHA256).Hash.ToLower()
          if ($actualHash -ne "$env:TESSERACT_SHA256") {
            Write-Error "Tesseract installer hash mismatch: expected $env:TESSERACT_SHA256, got $actualHash"
            exit 1
          }

          if (-not (Get-Command 7z -ErrorAction SilentlyContinue)) {
            choco install 7zip -y --no-progress
          }
          $extractDir = "$env:RUNNER_TEMP\tesseract-extracted"
          7z x $installer -o"$extractDir" -y | Out-Null

          New-Item -ItemType Directory -Force -Path "vendor" | Out-Null
          Move-Item "$extractDir" "vendor\tesseract"

          # Prune to what's actually needed at runtime (matches README's manual steps).
          # $PLUGINSDIR only appears via this raw NSIS extraction (not present when
          # installed normally) — it's installer scaffolding, not app runtime files.
          Remove-Item "vendor\tesseract\`$PLUGINSDIR" -Recurse -Force -ErrorAction SilentlyContinue
          Get-ChildItem vendor\tesseract -Filter *.exe | Where-Object { $_.Name -ne "tesseract.exe" } | Remove-Item -Force
          Get-ChildItem vendor\tesseract -Filter *.html | Remove-Item -Force
          Get-ChildItem vendor\tesseract\tessdata -Filter *.jar -ErrorAction SilentlyContinue | Remove-Item -Force
          Remove-Item vendor\tesseract\doc -Recurse -Force -ErrorAction SilentlyContinue
          Remove-Item vendor\tesseract\tessdata\osd.traineddata -Force -ErrorAction SilentlyContinue
          Remove-Item vendor\tesseract\tessdata\pdf.ttf -Force -ErrorAction SilentlyContinue
          Remove-Item vendor\tesseract\tesseract-uninstall.exe -Force -ErrorAction SilentlyContinue

          if (-not (Test-Path "vendor\tesseract\tesseract.exe")) {
            Write-Error "vendor\tesseract\tesseract.exe missing after extraction"
            exit 1
          }

      - name: Run tests
        run: python -m pytest tests/ -q

      - name: Build portable app
        run: python -m PyInstaller build/cost_extractor.spec --noconfirm --clean

      - name: OCR selftest against the packaged exe
        shell: pwsh
        run: |
          python scripts/make_selftest_fixture.py "$env:RUNNER_TEMP\selftest.pdf"
          & ".\dist\CostExtractor\CostExtractor.exe" --selftest "$env:RUNNER_TEMP\selftest.pdf"
          $output = Get-Content "$env:RUNNER_TEMP\selftest_output.txt" -Raw
          Write-Output $output
          if ($output -notmatch "grand_total=2345\.00") {
            Write-Error "OCR selftest did not produce the expected grand_total=2345.00 -- OCR is broken in the packaged build"
            exit 1
          }

      - name: Zip portable build
        id: zip
        shell: pwsh
        run: |
          $version = "${{ needs.determine-version.outputs.version }}"
          $zipName = "CostExtractor-$version-win64.zip"
          Compress-Archive -Path "dist\CostExtractor" -DestinationPath $zipName
          echo "zip_name=$zipName" >> $env:GITHUB_OUTPUT

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-build
          path: ${{ steps.zip.outputs.zip_name }}
          if-no-files-found: error

  build-macos:
    needs: determine-version
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Fetch and vendor Tesseract-OCR (with bundled dylibs)
        run: |
          set -euo pipefail
          brew install tesseract dylibbundler

          TESS_PREFIX="$(brew --prefix tesseract)"
          VENDOR_DIR="vendor/tesseract-macos"
          mkdir -p "$VENDOR_DIR/tessdata"

          cp "$TESS_PREFIX/bin/tesseract" "$VENDOR_DIR/tesseract"
          cp "$TESS_PREFIX/share/tessdata/eng.traineddata" "$VENDOR_DIR/tessdata/"

          chmod +w "$VENDOR_DIR/tesseract"
          dylibbundler -od -b \
            -x "$VENDOR_DIR/tesseract" \
            -d "$VENDOR_DIR/lib" \
            -p "@executable_path/lib/"

          if [ ! -x "$VENDOR_DIR/tesseract" ]; then
            echo "::error::$VENDOR_DIR/tesseract missing or not executable after bundling"
            exit 1
          fi

      - name: Verify vendored tesseract runs standalone
        run: |
          set -euo pipefail
          # Run from a different directory so any lingering absolute
          # Homebrew paths in the binary's load commands would surface as
          # a failure here, not be masked by cwd/Homebrew still matching.
          cd /tmp
          "$GITHUB_WORKSPACE/vendor/tesseract-macos/tesseract" --version

      - name: Run tests
        run: python -m pytest tests/ -q

      - name: Build portable app
        run: python -m PyInstaller build/cost_extractor_macos.spec --noconfirm --clean

      - name: OCR selftest against the packaged app
        run: |
          set -euo pipefail
          python scripts/make_selftest_fixture.py "$RUNNER_TEMP/selftest.pdf"
          "dist/CostExtractor.app/Contents/MacOS/CostExtractor" --selftest "$RUNNER_TEMP/selftest.pdf"
          output=$(cat "$RUNNER_TEMP/selftest_output.txt")
          echo "$output"
          if ! echo "$output" | grep -q "grand_total=2345.00"; then
            echo "::error::OCR selftest did not produce the expected grand_total=2345.00 -- OCR is broken in the packaged build"
            exit 1
          fi

      - name: Zip portable build
        id: zip
        run: |
          set -euo pipefail
          version="${{ needs.determine-version.outputs.version }}"
          zip_name="CostExtractor-$version-macos.zip"
          ditto -c -k --sequesterRsrc --keepParent "dist/CostExtractor.app" "$zip_name"
          echo "zip_name=$zip_name" >> "$GITHUB_OUTPUT"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-build
          path: ${{ steps.zip.outputs.zip_name }}
          if-no-files-found: error

  publish-release:
    needs: [determine-version, build-windows, build-macos]
    runs-on: ubuntu-latest
    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create GitHub Release
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ needs.determine-version.outputs.version }}" \
            --repo "${{ github.repository }}" \
            artifacts/windows-build/*.zip \
            artifacts/macos-build/*.zip \
            --title "${{ needs.determine-version.outputs.version }}" \
            --generate-notes
